<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheapest Skill-up</title>
<style>
:root {
  --bg: #f6f3ec; --panel: #fffdf8; --panel-2: #f9f5ec; --ink: #2a2620; --muted: #756c5e; --line: #e4ddcf;
  --accent: #8a5a12; --accent-ink: #fff; --chip: #efe8da; --chip-on: #8a5a12;
  --gold: #c99a1c; --silver: #8e9399; --copper: #b06a3b; --bad: #b3261e; --warn-bg: #fff4d6; --warn-line: #e9cf86;
  --rank-bg: #f3ecdc;
  --s1: #8a5a12; --s2: #2f6f8f; --s3: #6b8f2f; --s4: #8f2f5c; --s5: #5c4a9e; --s6: #2f8f7a; --s7: #a3542a; --s8: #5e6b75;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17150f; --panel: #211e17; --panel-2: #1c1a14; --ink: #ece6d8; --muted: #a99f8c; --line: #383226;
    --accent: #e0a440; --accent-ink: #1b1710; --chip: #2c271d; --chip-on: #e0a440;
    --gold: #f0c040; --silver: #c4c9cf; --copper: #d88a55; --bad: #ff8a80; --warn-bg: #2e2714; --warn-line: #6b5a24;
    --rank-bg: #2a2418;
    --s1: #e0a440; --s2: #5fb2d9; --s3: #a6cf5f; --s4: #e07aa8; --s5: #a796f0; --s6: #5fd1b8; --s7: #ec8f5e; --s8: #a3b0ba;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header { padding: 18px 24px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 21px; letter-spacing: .2px; }
header h1 a { color: inherit; text-decoration: none; }
header .sub { color: var(--muted); font-size: 13px; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; padding: 20px 24px 40px; max-width: 1320px; margin: 0 auto; }
.layout > * { min-width: 0; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; } header { padding: 14px 16px 10px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
aside.panel { align-self: start; position: sticky; top: 16px; }
@media (max-width: 900px) { aside.panel { position: static; } }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 6px; }
label.f:first-child { margin-top: 0; }
select, input[type=number], input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--chip-on); border-color: var(--chip-on); color: var(--accent-ink); }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
button.go { width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.error { border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 22px 0 8px; }
.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
.coin { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 1px; vertical-align: 0; }
.cg { background: var(--gold); } .cs { background: var(--silver); } .cc { background: var(--copper); }
.src { font-size: 11px; color: var(--muted); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { color: var(--muted); font-size: 12px; margin-top: 14px; }

/* Overview cards */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.mine { border-color: var(--accent); }
.card-head { display: flex; align-items: center; gap: 8px; }
.card-head h2 { flex: 1; }
.star { background: none; border: 0; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 4px; }
.star[aria-pressed=true] { color: var(--gold); }
.inputs { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 8px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.inputs input[type=number] { padding: 6px 8px; max-width: 110px; }
.targets { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.targets .chip { padding: 4px 10px; }
.targets input[type=number] { width: 80px; }
.miles { width: 100%; border-collapse: collapse; font-size: 14px; }
.miles td { padding: 5px 4px; border-top: 1px solid var(--line); }
.miles td.num { text-align: right; }
.miles tr.sel td { font-weight: 700; color: var(--accent); }
.miles .bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; min-width: 40px; }
.miles .bar span { display: block; height: 100%; background: var(--accent); }
.card .open { align-self: flex-start; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 7px; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.card .open:hover { background: var(--accent); color: var(--accent-ink); }

/* Profession page */
.back { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; margin-bottom: 10px; }
.prof-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin-bottom: 14px; }
.prof-head h2 { font-size: 22px; flex: 1 1 200px; }
.strip { display: flex; flex-wrap: wrap; gap: 10px 26px; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
.strip .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.strip .big { font-size: 22px; font-weight: 700; }
.views { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.view { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; font: inherit; color: var(--muted); cursor: pointer; }
.view[aria-selected=true] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
.route { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 6px 0 2px; border: 1px solid var(--line); }
.route div { height: 100%; min-width: 2px; border-right: 1px solid var(--panel); }
.route div:last-child { border-right: 0; }
.route-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.rank td { background: var(--rank-bg); }
tr.rank .rname { font-weight: 700; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--warn-line); background: var(--warn-bg); margin-left: 6px; white-space: nowrap; }
details.where { margin-top: 4px; font-size: 13px; }
details.where summary { cursor: pointer; color: var(--accent); font-size: 12px; }
details.where ul { margin: 6px 0 2px; padding-left: 18px; }
details.where li { margin: 2px 0; }
.unseen { font-size: 11px; color: var(--muted); }
ul.plain { margin: 0; padding-left: 18px; }
@media (max-width: 600px) {
  table.t th, table.t td { padding: 6px 4px; font-size: 13px; }
  table.t .lc { display: none; }
  .strip { gap: 8px 18px; }
}
</style>
</head>
<body>
<header>
  <h1><a href="#/">Cheapest Skill-up</a></h1>
  <span class="sub">Cheapest route to level WoW Forever professions, priced from TradeSkillMaster's public data</span>
</header>

<div class="layout">
  <aside class="panel">
    <form id="form">
      <label class="f" for="region">Auction house</label>
      <div class="row">
        <select id="region" aria-label="Region" style="flex:0 0 76px"></select>
        <select id="realm" aria-label="Auction house"></select>
      </div>
      <div class="hint">Trainer locations follow this faction.</div>

      <label class="f" for="price">Buy at</label>
      <select id="price"></select>

      <label class="f">Learn recipes from</label>
      <div class="chips" id="sources"></div>

      <label class="f" for="sellback">Crafted items</label>
      <select id="sellback">
        <option value="none">Keep or destroy (no credit)</option>
        <option value="vendor">Sell to a vendor</option>
        <option value="ah">Sell on the AH (after cut and deposit)</option>
      </select>

      <label class="f" for="overrides">Price overrides</label>
      <input id="overrides" type="text" placeholder="e.g. 2589=0, 2592=100">
      <div class="hint">itemId=copper. Use 0 for mats you already have.</div>

      <button class="go" id="go" type="submit">Re-download prices</button>
      <div class="hint" id="scan"></div>
    </form>
  </aside>

  <main id="main"></main>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SWATCH = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"].map(v => `var(${v})`);
const PRICE_LABEL = {minBuyout: "Min buyout", marketValue: "Market value", recent: "Recent value", historical: "Historical price"};
const REALM_LABEL = {"normal-alliance": "Normal · Alliance", "normal-horde": "Normal · Horde", "pvp-alliance": "PvP · Alliance", "pvp-horde": "PvP · Horde"};
const HOW = {auto: "Known", trainer: "Trainer", recipe: "AH recipe"};
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("csu:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("csu:" + k, JSON.stringify(v)); } catch {} },
};
const ceil = x => Math.ceil(x - 1e-9);
const clamp = (v, lo, hi) => Number.isFinite(v) ? Math.max(lo, Math.min(hi, Math.round(v))) : lo;

function money(c) {
  if (c === null || c === undefined) return '<span class="money">n/a</span>';
  c = Math.round(c);
  const neg = c < 0; c = Math.abs(c);
  const g = Math.floor(c / 10000), s = Math.floor(c / 100) % 100, cp = c % 100;
  let h = "";
  if (g) h += `${g.toLocaleString()}<i class="coin cg" title="gold"></i>`;
  if (g || s) h += `${s}<i class="coin cs" title="silver"></i>`;
  h += `${cp}<i class="coin cc" title="copper"></i>`;
  return `<span class="money">${neg ? "−" : ""}${h}</span>`;
}

let OPT;                                  // /api/options
let SETTINGS;                             // sidebar
let PROFS = store.get("profs") || {};     // {key: {from, to, mine}}
let VIEW = store.get("view") || "route";
let refreshNext = false;

function profState(key) {
  PROFS[key] = Object.assign({from: 1, to: OPT.defaults.target, mine: false}, PROFS[key] || {});
  return PROFS[key];
}
const saveProfs = () => store.set("profs", PROFS);
const nextMilestone = from => OPT.milestones.find(m => m > from) || OPT.max_skill;

async function api(path, extra) {
  const q = new URLSearchParams({
    region: SETTINGS.region, realm: SETTINGS.realm, price: SETTINGS.price, sources: SETTINGS.sources.join(","),
    sell_back: SETTINGS.sell_back, overrides: SETTINGS.overrides, ...extra,
  });
  if (refreshNext) { q.set("refresh", "1"); refreshNext = false; }
  const r = await fetch(`/api/${path}?${q}`);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  if (data.prices_updated) {
    const t = new Date(data.prices_updated);
    $("#scan").textContent = `TSM scan: ${isNaN(t) ? data.prices_updated : t.toLocaleString()}`;
  }
  return data;
}

function chip(container, value, label, on) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.value = value; b.textContent = label;
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.onclick = () => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); readSettings(); route(); };
  container.appendChild(b);
}
const fillSelect = (sel, values, current, labels = {}) => {
  sel.innerHTML = values.map(v => `<option value="${esc(v)}">${esc(labels[v] || v)}</option>`).join("");
  sel.value = current;
};

function readSettings() {
  SETTINGS = {
    region: $("#region").value, realm: $("#realm").value, price: $("#price").value,
    sources: [...$("#sources").querySelectorAll(".chip[aria-pressed=true]")].map(b => b.dataset.value),
    sell_back: $("#sellback").value, overrides: $("#overrides").value.replace(/\s+/g, ""),
  };
  store.set("settings", SETTINGS);
}

async function init() {
  OPT = await (await fetch("/api/options")).json();
  const d = Object.assign({}, OPT.defaults, store.get("settings") || {});
  fillSelect($("#region"), OPT.regions, d.region, {us: "US", eu: "EU"});
  fillSelect($("#realm"), OPT.realms, d.realm, REALM_LABEL);
  fillSelect($("#price"), OPT.price_fields, d.price, PRICE_LABEL);
  const SRC = {trainer: "Trainer", recipe: "AH recipe items"};
  const srcSel = (d.sources || []).filter(s => OPT.sources.includes(s));
  OPT.sources.forEach(s => chip($("#sources"), s, SRC[s] || s, (srcSel.length ? srcSel : OPT.defaults.sources).includes(s)));
  $("#sellback").value = ["none", "vendor", "ah"].includes(d.sell_back) ? d.sell_back : "none";
  $("#overrides").value = d.overrides || "";
  readSettings();
  $("#form").onsubmit = e => { e.preventDefault(); readSettings(); refreshNext = true; route(); };
  for (const el of ["#region", "#realm", "#price", "#sellback", "#overrides"]) $(el).onchange = () => { readSettings(); route(); };
  window.addEventListener("hashchange", route);
  route();
}

function route() {
  const m = location.hash.match(/^#\/([a-z_]+)/);
  if (m && OPT.professions.some(p => p.key === m[1])) renderProfession(m[1]);
  else renderOverview();
}

/* Skill + target inputs, shared by the cards and the profession page */
function skillInputs(key, st, onchange) {
  const custom = !OPT.milestones.includes(st.to);
  const box = document.createElement("div");
  box.className = "inputs";
  box.innerHTML = `<label for="from-${key}">Your skill</label>
    <input id="from-${key}" type="number" min="1" max="${OPT.max_skill - 1}" value="${st.from}">
    <span>Target</span>
    <div class="targets">${[150, 225, 300].map(t => `<button type="button" class="chip" data-t="${t}" aria-pressed="${st.to === t}">${t}</button>`).join("")}
      <input type="number" min="2" max="${OPT.max_skill}" placeholder="other" aria-label="Custom target" value="${custom ? st.to : ""}"></div>`;
  const fromIn = $(`#from-${key}`, box);
  fromIn.onchange = () => {
    st.from = clamp(+fromIn.value, 1, OPT.max_skill - 1);
    if (st.to <= st.from) st.to = nextMilestone(st.from);
    saveProfs(); onchange();
  };
  box.querySelectorAll(".targets .chip").forEach(b => b.onclick = () => {
    if (+b.dataset.t <= st.from) return;
    st.to = +b.dataset.t; saveProfs(); onchange();
  });
  const ci = $(".targets input", box);
  ci.onchange = () => { if (ci.value === "") return; st.to = clamp(+ci.value, st.from + 1, OPT.max_skill); saveProfs(); onchange(); };
  return box;
}

/* ---------------- Overview ---------------- */

function renderOverview() {
  const profs = [...OPT.professions].sort((a, b) => (profState(b.key).mine - profState(a.key).mine) || a.name.localeCompare(b.name));
  $("#main").innerHTML = `<div class="meta">Cost from your current skill to each milestone: materials, recipes, trainer fees and profession ranks. Star your professions to keep them first.</div>
    <div class="cards" id="cards"></div>`;
  for (const p of profs) {
    const card = document.createElement("section");
    card.className = "card"; card.dataset.prof = p.key;
    $("#cards").appendChild(card);
    drawCard(card, p);
  }
}

function drawCard(card, p) {
  const st = profState(p.key);
  card.classList.toggle("mine", st.mine);
  card.innerHTML = `<div class="card-head"><h2>${esc(p.name)}</h2>
      <button class="star" type="button" aria-pressed="${st.mine}" title="${st.mine ? "Unstar" : "Star: one of my professions"}" aria-label="My profession">★</button></div>
    <div class="slot"></div>
    <div class="miles-wrap"><span class="src"><span class="spinner"></span>Pricing…</span></div>
    <button type="button" class="open">Route to ${st.to} →</button>`;
  $(".slot", card).replaceWith(skillInputs(p.key, st, () => drawCard(card, p)));
  $(".star", card).onclick = () => { st.mine = !st.mine; saveProfs(); renderOverview(); };
  $(".open", card).onclick = () => { location.hash = `#/${p.key}`; };
  loadMilestones(card, p, st);
}

async function loadMilestones(card, p, st) {
  const wrap = $(".miles-wrap", card);
  try {
    const d = await api("overview", {prof: p.key, from: st.from, to: st.to});
    if (!card.isConnected || !wrap.isConnected) return;
    const max = Math.max(...d.milestones.map(m => m.total_copper), 1);
    wrap.innerHTML = `<table class="miles">` + d.milestones.map(m => `
      <tr class="${m.to === st.to ? "sel" : ""}"><td>${st.from} → ${m.to}${m.reached < m.to ? ` <span class="badge">stuck at ${m.reached}</span>` : ""}</td>
        <td style="width:40%"><div class="bar"><span style="width:${(m.total_copper / max * 100).toFixed(1)}%"></span></div></td>
        <td class="num">${money(m.total_copper)}</td></tr>`).join("") + `</table>`;
  } catch (e) {
    wrap.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

/* ---------------- Profession page ---------------- */

async function renderProfession(key) {
  const p = OPT.professions.find(x => x.key === key);
  const st = profState(key);
  const main = $("#main");
  main.innerHTML = `<div class="panel">
    <button class="back" type="button">← All professions</button>
    <div class="prof-head"><h2>${esc(p.name)}</h2><div class="slot"></div></div>
    <div id="detail"><span class="src"><span class="spinner"></span>Planning…</span></div></div>`;
  $(".slot", main).replaceWith(skillInputs("p-" + key, st, () => renderProfession(key)));
  $(".back", main).onclick = () => { location.hash = "#/"; };
  try {
    const d = await api("plan", {prof: key, from: st.from, to: st.to});
    if (location.hash !== `#/${key}`) return;
    drawDetail(d);
  } catch (e) {
    $("#detail").innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function trainersHtml(list, label = "Where to train") {
  if (!list || !list.length) return "";
  return `<details class="where"><summary>${label} (${list.length})</summary><ul>` + list.map(t =>
    `<li>${esc(t.name)} <span class="src">${esc(t.title)}</span> — ${esc(t.zone)} (${t.x.toFixed(1)}, ${t.y.toFixed(1)})${t.seen ? "" : ' <span class="unseen">not yet seen in Forever</span>'}</li>`
  ).join("") + `</ul></details>`;
}

function rankCost(r) {
  if (r.how === "quest") return '<span class="src">quest</span>';
  if (r.cost_copper === null) return '<span class="src">fee unknown</span>';
  return (r.cost_from === "classic" ? '<span class="src" title="Classic fee, used as an estimate">~</span>' : "") + money(r.cost_copper)
    + (r.how === "book" ? ' <span class="src">skill book</span>' : "");
}

function rankRow(r) {
  const how = {book: "Learn", quest: "Quest for"}[r.how] || "Train";
  const need = [r.skill ? `skill ${r.skill}+` : "", r.level ? `character level ${r.level}` : ""].filter(Boolean).join(", ");
  const detail = r.how === "trainer" ? (trainersHtml(r.trainers, "Trainers") || '<div class="src">Trainer locations unknown.</div>')
    : r.how === "book" ? '<div class="src">Buy the skill book from a vendor or the AH, then use it.</div>'
    : '<div class="src">Learned from a quest, not a trainer.</div>';
  return `<tr class="rank"><td class="money">${r.before ? "by " + r.before : "start"}</td>
    <td><span class="rname">${how} ${esc(r.name)}</span> <span class="src">cap ${r.cap}${need ? " · needs " + need : ""}</span>${detail}</td>
    <td class="lc"></td><td class="num"></td><td class="num">${rankCost(r)}</td></tr>`;
}

function drawDetail(d) {
  const p = d.plan;
  const learnBy = Object.fromEntries(p.learn.map(l => [l.recipe, l]));
  let h = "";
  if (p.reached < p.target) h += `<div class="error">Stuck at ${p.reached}: no allowed recipe skills up past this with known prices. Try allowing AH recipe items.</div>`;
  h += `<div class="strip">
    <div><div class="lbl">Total</div><div class="big">${money(p.grand_total_copper)}</div></div>
    <div><div class="lbl">Materials</div><div>${money(p.total_cost_copper + p.sell_credit_copper)}</div></div>
    ${p.sell_back ? `<div><div class="lbl">Sold ${p.sell_back === "vendor" ? "to vendor" : "on AH"}</div><div>${money(-p.sell_credit_copper)}</div></div>` : ""}
    <div><div class="lbl">Recipes &amp; trainer</div><div>${money(p.learn_cost_copper)}</div></div>
    <div><div class="lbl">Ranks</div><div>${money(p.ranks_cost_copper)}</div></div>
    ${p.tools_cost_copper ? `<div><div class="lbl">Tools</div><div>${money(p.tools_cost_copper)}</div></div>` : ""}
    <div><div class="lbl">Crafts</div><div>${p.steps.reduce((a, s) => a + ceil(s.expected_crafts), 0).toLocaleString()}</div></div>
  </div>
  <div class="views" role="tablist">${["route", "materials", "recipes"].map(v =>
    `<button class="view" type="button" role="tab" data-v="${v}" aria-selected="${VIEW === v}">${{route: "Route", materials: "Materials", recipes: "Recipes & ranks"}[v]}</button>`).join("")}</div>
  <div id="view"></div>`;
  if (d.foreverdb) h += `<div class="note">Recipe sources, trainer fees and trainer locations: <a href="https://foreverdb.net" target="_blank" rel="noopener">Data from ForeverDB.net</a>. Prices: TradeSkillMaster (${esc(d.auction_house)}, ${esc(PRICE_LABEL[d.price_field] || d.price_field)}).</div>`;
  h += `<div class="note">Quantities are expected values; buy a little extra. Min buyout is the cheapest single listing, so large orders will cost more.</div>`;
  $("#detail").innerHTML = h;
  $("#detail").querySelectorAll(".view").forEach(b => b.onclick = () => { VIEW = b.dataset.v; store.set("view", VIEW); drawDetail(d); });
  $("#view").innerHTML = VIEW === "materials" ? materialsView(p) : VIEW === "recipes" ? recipesView(p) : routeView(p, learnBy);
}

function routeView(p, learnBy) {
  const colors = {};
  [...new Set(p.steps.map(s => s.recipe))].forEach((r, i) => colors[r] = SWATCH[i % SWATCH.length]);
  const span = p.target - p.start;
  let h = `<div class="route">` + p.steps.map(s =>
    `<div style="width:${((s.to - s.from) / span * 100).toFixed(2)}%;background:${colors[s.recipe]}" title="${esc(s.recipe)}: ${s.from}–${s.to}"></div>`).join("") +
    `</div><div class="route-scale"><span>${p.start}</span><span>${p.target}</span></div>`;
  h += `<div class="table-wrap"><table class="t"><thead><tr><th>Skill</th><th>Recipe</th><th class="lc">Learn</th><th class="num">Crafts</th><th class="num">Cost</th></tr></thead><tbody>`;
  const pending = [...p.ranks];
  const seen = new Set();
  for (const s of p.steps) {
    while (pending.length && (s.to > pending[0].before || pending[0].cap <= 75)) h += rankRow(pending.shift());
    const l = learnBy[s.recipe];
    const first = !seen.has(s.recipe); seen.add(s.recipe);
    let learn = `<span class="src">${esc(HOW[s.how] || s.how)}</span>`;
    let extra = "";
    if (first && l) {
      learn += `<div class="src">${l.cost_copper === null ? "fee unknown" : (l.fee_from === "classic" ? "~" : "") + money(l.cost_copper)}</div>`;
      if (l.how === "trainer") extra = trainersHtml(l.trainers);
      else if (l.how === "recipe") extra = `<div class="src">Buy ${l.recipe_items.map(i => esc(i.name)).join(" / ")} on the AH</div>`;
    }
    const low = s.low_chance ? `<span class="badge" title="About ${s.crafts_per_point.toFixed(1)} crafts per skill point">low chance</span>` : "";
    h += `<tr><td class="money">${s.from}–${s.to}</td><td><span class="sw" style="background:${colors[s.recipe]}"></span>${esc(s.recipe)}${low}${extra}</td>
      <td class="lc">${learn}</td><td class="num">${ceil(s.expected_crafts)}</td><td class="num">${money(s.cost_copper)}</td></tr>`;
  }
  for (const r of pending) h += rankRow(r);
  return h + `</tbody></table></div>`;
}

function materialsView(p) {
  let h = "";
  const cf = Object.entries(p.craft_first);
  if (cf.length) h += `<h3 style="margin-top:0">Craft these first (cheaper than buying)</h3><ul class="plain">` + cf.map(([n, q]) => `<li>${ceil(q)} × ${esc(n)}</li>`).join("") + `</ul>`;
  const buy = [...p.buy].map(b => ({...b, total: b.unit_price_copper == null ? Infinity : b.unit_price_copper * b.quantity})).sort((a, b) => b.total - a.total);
  h += `<h3${cf.length ? "" : ' style="margin-top:0"'}>Shopping list</h3><div class="table-wrap"><table class="t"><thead><tr><th class="num">Qty</th><th>Item</th><th class="num">Each</th><th class="num">Total</th></tr></thead><tbody>` +
    buy.map(b => `<tr><td class="num">${ceil(b.quantity)}</td><td>${esc(b.name)} <span class="src">${esc(b.price_source)}</span></td>
      <td class="num">${money(b.unit_price_copper)}</td><td class="num">${b.total === Infinity ? "n/a" : money(b.total)}</td></tr>`).join("") + `</tbody></table></div>`;
  if (p.tools.length) h += `<h3>Tools needed once</h3><ul class="plain">` + p.tools.map(t => `<li>${esc(t.name)}: ${money(t.cost_copper)}</li>`).join("") + `</ul>`;
  if (p.unpriced.length) h += `<div class="error" style="margin-top:14px">No price found for: ${p.unpriced.map(esc).join(", ")}</div>`;
  if (p.no_sell_price && p.no_sell_price.length) h += `<div class="warn" style="margin-top:14px">No sell price for: ${p.no_sell_price.map(esc).join(", ")} (counted as 0).</div>`;
  return h;
}

function recipesView(p) {
  let h = "";
  if (p.ranks.length) {
    h += `<h3 style="margin-top:0">Profession ranks</h3><div class="table-wrap"><table class="t"><thead><tr><th>When</th><th>Rank</th><th class="lc"></th><th></th><th class="num">Cost</th></tr></thead><tbody>` +
      p.ranks.map(rankRow).join("") + `</tbody></table></div>`;
  }
  const NOTE = {classic: ' <span class="src" title="Classic trainer requirement, used as an estimate">Classic</span>',
                assumed: ' <span class="src" title="Unknown; assumed to be the recipe\'s yellow level">est.</span>'};
  if (p.learn.length) {
    h += `<h3${p.ranks.length ? "" : ' style="margin-top:0"'}>Recipes to learn</h3><div class="table-wrap"><table class="t"><thead><tr><th>Recipe</th><th>From</th><th class="num">Learn at</th><th class="num">Cost</th></tr></thead><tbody>` +
      [...p.learn].sort((a, b) => a.learn_level - b.learn_level || a.recipe.localeCompare(b.recipe)).map(l => `<tr><td>${esc(l.recipe)}${l.how === "trainer" ? trainersHtml(l.trainers) : ""}</td>
        <td>${l.how === "recipe" ? "AH: " + l.recipe_items.map(i => esc(i.name)).join(" / ") : "Trainer"}</td>
        <td class="num">${l.learn_level}${NOTE[l.learn_from] || ""}</td>
        <td class="num">${l.cost_copper === null ? '<span class="src">fee unknown</span>' : (l.fee_from === "classic" ? '<span class="src">~</span>' : "") + money(l.cost_copper)
          + (l.fee_from === "forever" ? ' <span class="src" title="Fee players saw at a Forever trainer">seen</span>' : "")}</td></tr>`).join("") + `</tbody></table></div>`;
  } else {
    h += `<p class="src">No recipes to buy or train on this route.</p>`;
  }
  return h;
}

init().catch(e => { $("#main").innerHTML = `<div class="error">Could not start: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
